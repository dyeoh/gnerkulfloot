# The checks from AGENTS.md "Before you commit", run on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        # Offline, so clippy checks against the committed .sqlx/ like Docker does.
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      - name: Migrate
        run: sqlx migrate run

      - name: Query cache is up to date
        run: cargo sqlx prepare --check -- --all-targets

      - name: Test
        run: cargo test
